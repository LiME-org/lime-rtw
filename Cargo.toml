[package]
name = "lime-rtw"
version = "0.5.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tui"]
proto = ["dep:prost", "dep:prost-build"]
tui = ["dep:crossterm", "dep:tui", "dep:tui-input"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.6", features = ["std", "derive", "cargo"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"]}
serde-hex = "0.1.0"
glob = "0.3"
duration-str = "0.21.0"
index_list = "0.3"
prost = { version = "0.14", optional = true }
lime-model-extractors = { git = "https://github.com/LiME-org/lime-model-extractors", tag = "0.2.0" }
# TUI dependencies
crossterm = { version = "0.29", optional = true }
tui = { package = "ratatui", version = "0.30.0", optional = true }
tui-input = { version = "0.15.5", optional = true }

[target.'cfg(target_os="linux")'.dependencies]
libbpf-rs = "0.26"
nc = "0.9"
nix = { version = "0.31", features = ["time", "signal", "process", "sched", "ioctl"] }
plain = "0.2"
rustc-hash = "2"
signal-hook = "0.4.3"
sysinfo = "0.38"

[target.'cfg(target_os="linux")'.build-dependencies]
libbpf-cargo = "0.26"

[build-dependencies]
prost-build = { version = "0.14", optional = true }

[profile.bench]
inherits = "release"
debug = true
strip = "none"
